name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run only new browser-only migration and cleanup checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[browser-099-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-browser-only099.test.mjs
      - name: Run only new manual Pico source-package checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[source-100-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-source-package100.test.mjs
      - name: Run all tests across eight shards
        if: ${{ !contains(github.event.head_commit.message, '[stm32-new-only]') && !contains(github.event.head_commit.message, '[stm32-066-only]') && !contains(github.event.head_commit.message, '[stm32-067-only]') && !contains(github.event.head_commit.message, '[stm32-068-only]') && !contains(github.event.head_commit.message, '[stm32-069-only]') && !contains(github.event.head_commit.message, '[tiva-070-only]') && !contains(github.event.head_commit.message, '[tiva-071-only]') && !contains(github.event.head_commit.message, '[lcd-072-only]') && !contains(github.event.head_commit.message, '[common-073-only]') && !contains(github.event.head_commit.message, '[components-074-only]') && !contains(github.event.head_commit.message, '[expansion-075-only]') && !contains(github.event.head_commit.message, '[protocols-076-only]') && !contains(github.event.head_commit.message, '[visuals-077-only]') && !contains(github.event.head_commit.message, '[visuals-078-only]') && !contains(github.event.head_commit.message, '[visuals-079-only]') && !contains(github.event.head_commit.message, '[visuals-080-only]') && !contains(github.event.head_commit.message, '[pico-082-only]') && !contains(github.event.head_commit.message, '[pico-083-only]') && !contains(github.event.head_commit.message, '[pico-084-only]') && !contains(github.event.head_commit.message, '[pico-085-only]') && !contains(github.event.head_commit.message, '[pico-086-only]') && !contains(github.event.head_commit.message, '[pico-087-only]') && !contains(github.event.head_commit.message, '[pico-088-only]') && !contains(github.event.head_commit.message, '[pico-089-only]') && !contains(github.event.head_commit.message, '[pico-090-only]') && !contains(github.event.head_commit.message, '[pico-091-only]') && !contains(github.event.head_commit.message, '[pico-092-only]') && !contains(github.event.head_commit.message, '[pico-093-only]') && !contains(github.event.head_commit.message, '[pico-094-only]') && !contains(github.event.head_commit.message, '[browser-099-only]') && !contains(github.event.head_commit.message, '[source-100-only]') }}
        run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 tests/*.test.mjs
      - name: Run only new Pico USB CYW43 interface and photo artwork checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-084-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-usb084.test.mjs tests/pico-cyw43-084.test.mjs tests/pico-visual084.test.mjs
      - name: Run only new Pico USB radio PIO DMA multicore checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-083-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-advanced083.test.mjs
      - name: Run only new Pico debugger and peripheral checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-082-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-debug-peripherals082.test.mjs
      # Explicit user-requested validation scope for the 0.65 implementation.
      # Ordinary pushes, pull requests and manual runs retain the full gate.
      - name: Run only the new STM32 acceptance tests across eight shards
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stm32-new-only]') }}
        run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 tests/*-new.test.mjs
      - name: Run only the new 0.66 STM32 acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stm32-066-only]') }}
        run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 tests/stm32-v066-*.test.mjs
      - name: Run only new native Pico ROM RP2 thread and SDK checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-093-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-native093.test.mjs tests/pico-sdk-native093.test.mjs tests/pico-rom-assets093.test.mjs
      - name: Run only new browser CMake and CYW43 ROM data checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-094-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-browser094.test.mjs tests/pico-cyw43-rom094.test.mjs
      - run: npm run build
      - name: Run only the new 0.67 STM32 acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stm32-067-only]') }}
        run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 tests/stm32-v067-*.test.mjs
      - name: Run only the new 0.68 STM32 acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stm32-068-only]') }}
        run: node --test --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 tests/stm32-v068-*.test.mjs
      - name: Run only the new 0.69 STM32 acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[stm32-069-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/stm32-v069-*.test.mjs
      - name: Run only the new Tiva C 0.70 acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tiva-070-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/tiva-c070.test.mjs
      - name: Run only the new Tiva C 0.71 UI acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tiva-071-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/tiva-c071-ui.test.mjs
      - name: Run only the new 0.72 LCD acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[lcd-072-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/lcd-v072.test.mjs
      - name: Run only the new 0.73 common-component acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[common-073-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/common-components-v073.test.mjs
      - name: Run only the new 0.74 compiled C component acceptance tests
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[components-074-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/native-components-v074.test.mjs
      - name: Install pinned AVR compiler for new firmware checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[expansion-075-only]') }}
        run: npm install --prefix .sites-runtime/avr-tools --no-audit --no-fund @horang-corp/avr-gcc-wasm@0.2.0
      - name: Run only new 0.75 expansion acceptance checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[expansion-075-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/expansion-v075.test.mjs tests/expansion-profile075.test.mjs
      - name: Install AVR compiler for new protocol and visual-card firmware checks
        if: ${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[protocols-076-only]') || contains(github.event.head_commit.message, '[visuals-077-only]')) }}
        run: npm install --prefix .sites-runtime/avr-tools --no-audit --no-fund @horang-corp/avr-gcc-wasm@0.2.0
      - name: Run only newly implemented 0.76 protocol paths
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[protocols-076-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/protocols-v076-*.test.mjs
      - name: Run only newly added 0.77 visual and card checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[visuals-077-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/visuals-v077-*.test.mjs
      - name: Run only newly added 0.78 physical artwork checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[visuals-078-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/visuals-v078.test.mjs
      - name: Run only newly added 0.79 photo-based artwork checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[visuals-079-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/visuals-v079.test.mjs
      - name: Run only newly added 0.80 photographic-catalog checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[visuals-080-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/visuals-v080.test.mjs
      - name: Run only new Pico 0.85 flash checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-085-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-flash085.test.mjs
      - name: Run only new Pico 0.86 original ROM checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-086-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-rom086.test.mjs
      - name: Run only new Pico 0.87 native ROM flash checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-087-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-rom087.test.mjs
      - name: Run only new Pico 0.88 CYW43439 host bus checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-088-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-cyw43-chip088.test.mjs
      - name: Run only new Pico 0.89 hardware and CYW43 control checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-089-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-hardware089.test.mjs tests/pico-cyw43-backplane089.test.mjs
      - name: Run only new Pico 0.90 SDK languages and Hazard3 checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-090-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-languages090.test.mjs tests/pico-micropython090.test.mjs
      - name: Run only new Pico 0.91 SDK container and Python PIO Timer checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-091-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-sdk091.test.mjs tests/pico-python091.test.mjs
      - name: Run only new Pico 0.92 CMake declaration and Python DMA checks
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[pico-092-only]') }}
        run: node --test --test-shard=${{ matrix.shard }}/8 tests/pico-cmake092.test.mjs tests/pico-dma092.test.mjs
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check that this is still the latest main commit
        id: head
        shell: bash
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
          elif git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "existing_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select next version
        if: steps.head.outputs.current == 'true'
        id: version
        run: python3 scripts/release_version.py
      - name: Commit release metadata and tag
        if: steps.head.outputs.current == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "$RELEASE_TAG"
      - name: Publish GitHub Release
        if: steps.head.outputs.current == 'true' || steps.head.outputs.existing_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.head.outputs.existing_tag }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
